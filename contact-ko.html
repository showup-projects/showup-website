<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>문의 — showup</title>

    <link rel="icon" id="favicon" type="image/svg+xml" href="assets/favicon-dark.svg">
    <script>
        (function() {
            var stored = localStorage.getItem('theme');
            var theme = stored || (window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
            document.documentElement.setAttribute('data-theme', theme);
            document.getElementById('favicon').href = theme === 'light' ? 'assets/favicon-light.svg' : 'assets/favicon-dark.svg';
        })();
    </script>

        <link rel="stylesheet" href="assets/css/footer.css">

    <style>
        :root {
            --bg-primary: #0A0A0A;
            --bg-secondary: #111111;
            --text-primary: #FFFFFF;
            --text-secondary: rgba(255, 255, 255, 0.6);
            --text-tertiary: rgba(255, 255, 255, 0.35);
            --accent-blue: #FFFFFF;
            --border: rgba(255, 255, 255, 0.2);
            --glass: #0A0A0A;
            --glass-border: rgba(255, 255, 255, 0.2);
            --nav-height: 72px;
        }

        [data-theme="light"] {
            --bg-primary: #FFFFFF;
            --bg-secondary: #FFFFFF;
            --text-primary: #1A1A1A;
            --text-secondary: rgba(26, 26, 26, 0.55);
            --text-tertiary: rgba(26, 26, 26, 0.3);
            --accent-blue: #1A1A1A;
            --border: rgba(0, 0, 0, 0.15);
            --glass: #FFFFFF;
            --glass-border: rgba(0, 0, 0, 0.15);
        }

        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
        html { scroll-behavior: smooth; -webkit-font-smoothing: antialiased; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Helvetica Neue', Helvetica, Arial, sans-serif;
            color: var(--text-primary);
            background: var(--bg-primary);
            line-height: 1.6;
        }
        a { color: inherit; text-decoration: none; }

        /* Film grain — disabled */
        body::after { display: none; }

        /* Navigation */
        .nav {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 1000;
            height: var(--nav-height);
            background: transparent;
            border: none;
        }
        .nav::before {
            display: none;
        }
        .nav-inner {
            max-width: 1280px;
            margin: 0 auto;
            padding: 0 32px;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: relative;
        }
        .nav-logo {
            display: flex;
            align-items: center;
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
        }
        .nav-logo img {
            height: 34px;
            width: auto;
            display: block;
        }
        img.logo-dark { display: block; }
        img.logo-light { display: none; }
        [data-theme="light"] img.logo-dark { display: none; }
        [data-theme="light"] img.logo-light { display: block; }
        .nav-actions {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-left: auto;
        }
        .lang-dropdown {
            position: relative;
            flex-shrink: 0;
        }
        .lang-current {
            display: flex;
            align-items: center;
            gap: 4px;
            padding: 6px 4px;
            background: transparent;
            border: none;
            color: var(--text-secondary);
            font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Helvetica Neue', Helvetica, Arial, sans-serif;
            font-weight: 600;
            font-size: 0.75rem;
            letter-spacing: 0.04em;
            text-transform: uppercase;
            cursor: pointer;
            transition: color 0.2s ease;
        }
        .lang-current:hover {
            color: var(--text-primary);
        }
        .lang-current svg {
            width: 10px;
            height: 10px;
            transition: transform 0.2s ease;
        }
        .lang-dropdown.open .lang-current svg {
            transform: rotate(180deg);
        }
        .lang-menu {
            position: absolute;
            top: calc(100% + 6px);
            right: 0;
            background: var(--bg-primary);
            border: 1px solid var(--border);
            min-width: 100%;
            opacity: 0;
            pointer-events: none;
            transform: translateY(-4px);
            transition: opacity 0.15s ease, transform 0.15s ease;
            z-index: 100;
        }
        .lang-dropdown.open .lang-menu {
            opacity: 1;
            pointer-events: auto;
            transform: translateY(0);
        }
        .lang-menu a {
            display: block;
            width: 100%;
            padding: 8px 12px;
            color: var(--text-secondary);
            font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Helvetica Neue', Helvetica, Arial, sans-serif;
            font-weight: 600;
            font-size: 0.75rem;
            letter-spacing: 0.04em;
            text-transform: uppercase;
            text-decoration: none;
            transition: color 0.15s ease, background 0.15s ease;
        }
        .lang-menu a:hover {
            color: var(--text-primary);
            background: rgba(255,255,255,0.06);
        }
        [data-theme="light"] .lang-menu a:hover {
            background: rgba(0,0,0,0.04);
        }
        .lang-menu a.active {
            color: var(--text-primary);
        }
        .theme-toggle {
            width: 38px;
            height: 38px;
            border: none;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            background: transparent;
            cursor: pointer;
            transition: color 0.3s ease;
            color: var(--text-secondary);
        }
        .theme-toggle:hover { color: var(--text-primary); }
        .theme-toggle svg { width: 18px; height: 18px; transition: transform 0.2s ease; }
        .theme-toggle:hover svg { transform: rotate(15deg); }
        .icon-sun { display: block; }
        .icon-moon { display: none; }
        [data-theme="light"] .icon-sun { display: none; }
        [data-theme="light"] .icon-moon { display: block; }

        /* Content */
        .contact-content {
            max-width: 760px;
            margin: 0 auto;
            padding: calc(var(--nav-height) + 80px) 24px 100px;

        .contact-content h1 {

            font-weight: 900;
            font-size: clamp(2rem, 4vw, 3rem);
            line-height: 1.1;
            letter-spacing: -0.04em;
            text-transform: uppercase;
            margin-bottom: 12px;
        }
        .contact-subtitle {
            color: var(--text-secondary);
            font-size: 1.05rem;
            line-height: 1.7;
            margin-bottom: 48px;
            padding-bottom: 32px;
            border-bottom: 1px solid var(--border);
        }
        .contact-content h2 {
            font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Helvetica Neue', Helvetica, Arial, sans-serif;
            font-weight: 900;
            font-size: 1.3rem;
            line-height: 1.2;
            letter-spacing: -0.03em;
            text-transform: uppercase;
            margin-top: 40px;
            margin-bottom: 12px;
        }
        .contact-content p {
            color: var(--text-secondary);
            font-size: 0.98rem;
            line-height: 1.8;
            margin-bottom: 16px;
        }
        .contact-content a {
            color: var(--text-primary);
            text-decoration: underline;
            text-underline-offset: 3px;
        }
        .contact-content a.no-underline { text-decoration: none; }
        .contact-content a:hover { opacity: 0.7; }
        .contact-email {
            display: inline-block;
            font-size: 1.2rem;
            font-weight: 600;
            margin-top: 4px;
        }

        /* Responsive */
        @media (max-width: 768px) {
            :root { --nav-height: 64px; }
            .contact-content { padding-top: calc(var(--nav-height) + 48px); }
        }
        
        @media (prefers-reduced-motion: reduce) {
            * { transition-duration: 0.01ms !important; }
        }
    </style>

    <script>
        const themeToggle = document.getElementById('themeToggle');
        function toggleTheme() {
            const current = document.documentElement.getAttribute('data-theme');
            const next = current === 'light' ? 'dark' : 'light';
            document.documentElement.setAttribute('data-theme', next);
            localStorage.setItem('theme', next);
            document.getElementById('favicon').href = next === 'light' ? 'assets/favicon-light.svg' : 'assets/favicon-dark.svg';
        }
        themeToggle.addEventListener('click', toggleTheme);

        const langDropdown = document.getElementById('langDropdown');
        const langCurrent = document.getElementById('langCurrent');
        langCurrent.addEventListener('click', () => {
            langDropdown.classList.toggle('open');
        });
        document.addEventListener('click', (e) => {
            if (!langDropdown.contains(e.target)) langDropdown.classList.remove('open');
        });

        window.matchMedia('(prefers-color-scheme: light)').addEventListener('change', (e) => {
            localStorage.removeItem('theme');
            const theme = e.matches ? 'light' : 'dark';
            document.documentElement.setAttribute('data-theme', theme);
            document.getElementById('favicon').href = theme === 'light' ? 'assets/favicon-light.svg' : 'assets/favicon-dark.svg';
        });
    </script>
