<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>문의 — showup</title>
    <meta name="description" content="showup 팀에 연락하세요. 여러분의 의견을 기다립니다.">
    <link rel="icon" id="favicon" type="image/svg+xml" href="assets/favicon-dark.svg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script>
        (function() {
            var theme = localStorage.getItem('theme');
            if (theme) {
                document.documentElement.setAttribute('data-theme', theme);
                document.getElementById('favicon').href = theme === 'light' ? 'assets/favicon-light.svg' : 'assets/favicon-dark.svg';
            }
        })();
    </script>

    <style>
        :root {
            --bg-primary: #0A0A0A;
            --bg-secondary: #111111;
            --text-primary: #FFFFFF;
            --text-secondary: rgba(255, 255, 255, 0.6);
            --text-tertiary: rgba(255, 255, 255, 0.35);
            --accent-blue: #FFFFFF;
            --border: rgba(255, 255, 255, 0.2);
            --glass: #0A0A0A;
            --glass-border: rgba(255, 255, 255, 0.2);
            --nav-height: 72px;
        }

        [data-theme="light"] {
            --bg-primary: #F4F4F4;
            --bg-secondary: #F4F4F4;
            --text-primary: #1A1A1A;
            --text-secondary: rgba(26, 26, 26, 0.55);
            --text-tertiary: rgba(26, 26, 26, 0.3);
            --accent-blue: #1A1A1A;
            --border: rgba(0, 0, 0, 0.15);
            --glass: #F4F4F4;
            --glass-border: rgba(0, 0, 0, 0.15);
        }

        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
        html { scroll-behavior: smooth; -webkit-font-smoothing: antialiased; }
        body {
            font-family: 'Inter', sans-serif;
            color: var(--text-primary);
            background: var(--bg-primary);
            line-height: 1.6;
        }
        a { color: inherit; text-decoration: none; }

        /* Film grain — disabled */
        body::after { display: none; }

        /* Navigation */
        .nav {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 1000;
            height: var(--nav-height);
            background: transparent;
            border: none;
        }
        .nav::before {
            display: none;
        }
        .nav-inner {
            max-width: 1280px;
            margin: 0 auto;
            padding: 0 32px;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: relative;
        }
        .nav-logo {
            display: flex;
            align-items: center;
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
        }
        .nav-logo img {
            height: 34px;
            width: auto;
            display: block;
        }
        img.logo-dark { display: block; }
        img.logo-light { display: none; }
        [data-theme="light"] img.logo-dark { display: none; }
        [data-theme="light"] img.logo-light { display: block; }
        .nav-actions {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-left: auto;
        }
        .lang-dropdown {
            position: relative;
            flex-shrink: 0;
        }
        .lang-current {
            display: flex;
            align-items: center;
            gap: 4px;
            padding: 6px 4px;
            background: transparent;
            border: none;
            color: var(--text-secondary);
            font-family: 'Inter', sans-serif;
            font-weight: 600;
            font-size: 0.75rem;
            letter-spacing: 0.04em;
            text-transform: uppercase;
            cursor: pointer;
            transition: color 0.2s ease;
        }
        .lang-current:hover {
            color: var(--text-primary);
        }
        .lang-current svg {
            width: 10px;
            height: 10px;
            transition: transform 0.2s ease;
        }
        .lang-dropdown.open .lang-current svg {
            transform: rotate(180deg);
        }
        .lang-menu {
            position: absolute;
            top: calc(100% + 6px);
            right: 0;
            background: var(--bg-primary);
            border: 1px solid var(--border);
            min-width: 100%;
            opacity: 0;
            pointer-events: none;
            transform: translateY(-4px);
            transition: opacity 0.15s ease, transform 0.15s ease;
            z-index: 100;
        }
        .lang-dropdown.open .lang-menu {
            opacity: 1;
            pointer-events: auto;
            transform: translateY(0);
        }
        .lang-menu a {
            display: block;
            width: 100%;
            padding: 8px 12px;
            color: var(--text-secondary);
            font-family: 'Inter', sans-serif;
            font-weight: 600;
            font-size: 0.75rem;
            letter-spacing: 0.04em;
            text-transform: uppercase;
            text-decoration: none;
            transition: color 0.15s ease, background 0.15s ease;
        }
        .lang-menu a:hover {
            color: var(--text-primary);
            background: rgba(255,255,255,0.06);
        }
        [data-theme="light"] .lang-menu a:hover {
            background: rgba(0,0,0,0.04);
        }
        .lang-menu a.active {
            color: var(--text-primary);
        }
        .theme-toggle {
            width: 38px;
            height: 38px;
            border: none;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            background: transparent;
            cursor: pointer;
            transition: color 0.3s ease;
            color: var(--text-secondary);
        }
        .theme-toggle:hover { color: var(--text-primary); }
        .theme-toggle svg { width: 18px; height: 18px; transition: transform 0.2s ease; }
        .theme-toggle:hover svg { transform: rotate(15deg); }
        .icon-sun { display: block; }
        .icon-moon { display: none; }
        [data-theme="light"] .icon-sun { display: none; }
        [data-theme="light"] .icon-moon { display: block; }

        /* Content */
        .contact-content {
            max-width: 760px;
            margin: 0 auto;
            padding: calc(var(--nav-height) + 80px) 24px 100px;
        }
        .contact-content h1 {
            font-family: 'Inter', sans-serif;
            font-weight: 900;
            font-size: clamp(2rem, 4vw, 3rem);
            line-height: 1.1;
            letter-spacing: -0.04em;
            text-transform: uppercase;
            margin-bottom: 12px;
        }
        .contact-subtitle {
            color: var(--text-secondary);
            font-size: 1.05rem;
            line-height: 1.7;
            margin-bottom: 48px;
            padding-bottom: 32px;
            border-bottom: 1px solid var(--border);
        }
        .contact-content h2 {
            font-family: 'Inter', sans-serif;
            font-weight: 900;
            font-size: 1.3rem;
            line-height: 1.2;
            letter-spacing: -0.03em;
            text-transform: uppercase;
            margin-top: 40px;
            margin-bottom: 12px;
        }
        .contact-content p {
            color: var(--text-secondary);
            font-size: 0.98rem;
            line-height: 1.8;
            margin-bottom: 16px;
        }
        .contact-content a {
            color: var(--text-primary);
            text-decoration: underline;
            text-underline-offset: 3px;
        }
        .contact-content a:hover { opacity: 0.7; }
        .contact-email {
            display: inline-block;
            font-size: 1.2rem;
            font-weight: 600;
            margin-top: 4px;
        }

        /* Footer */
        .footer {
            border-top: 1px solid var(--border);
            padding: 80px 24px 40px;
            background: var(--bg-primary);
        }
        .footer-inner { max-width: 1080px; margin: 0 auto; }
        .footer-top {
            display: grid;
            grid-template-columns: 1.2fr 2fr;
            gap: 64px;
            margin-bottom: 64px;
        }
        .footer-logo {
            display: inline-block;
            margin-bottom: 16px;
        }
        .footer-logo img {
            height: 34px;
            width: auto;
        }
        .footer-brand p {
            color: var(--text-secondary);
            font-size: 0.92rem;
            line-height: 1.6;
            max-width: 280px;
        }
        .footer-links {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 32px;
        }
        .footer-col h4 {
            font-family: 'Inter', sans-serif;
            font-weight: 400;
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: var(--text-tertiary);
            margin-bottom: 20px;
        }
        .footer-col a {
            display: block;
            color: var(--text-secondary);
            font-size: 0.92rem;
            padding: 6px 0;
            transition: color 0.2s ease;
        }
        .footer-col a:hover { color: var(--text-primary); }
        .footer-bottom {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding-top: 32px;
            border-top: 1px solid var(--border);
            margin-left: calc(-50vw + 50%);
            margin-right: calc(-50vw + 50%);
            padding-left: 24px;
            padding-right: 24px;
        }
        .footer-bottom p {
            color: var(--text-tertiary);
            font-size: 0.85rem;
        }
        .app-store-badge {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            padding: 10px 20px;
            border-radius: 0;
            background: #fff;
            color: #000;
            font-family: 'Inter', sans-serif;
            font-weight: 400;
            font-size: 0.82rem;
            border: 2px solid var(--text-primary);
            transition: opacity 0.2s ease;
        }
        .app-store-badge:hover { opacity: 0.85; }
        .app-store-badge svg { width: 18px; height: 18px; }

        /* Light theme overrides */
        [data-theme="light"] .app-store-badge {
            background: #1A1A1A;
            color: #F4F4F4;
        }

        /* Responsive */
        @media (max-width: 768px) {
            :root { --nav-height: 64px; }
            .contact-content { padding-top: calc(var(--nav-height) + 48px); }
            .footer-top { grid-template-columns: 1fr; gap: 40px; }
            .footer-links { grid-template-columns: repeat(3, 1fr); gap: 20px; }
            .footer-bottom { flex-direction: column; gap: 20px; text-align: center; }
        }
        @media (max-width: 480px) {
            .footer-links { grid-template-columns: 1fr 1fr; }
        }
        @media (prefers-reduced-motion: reduce) {
            * { transition-duration: 0.01ms !important; }
        }
    </style>
</head>
<body>

    <!-- Navigation -->
    <nav class="nav">
        <div class="nav-inner">
            <a href="index.html" class="nav-logo">
                <img src="assets/images/logo-dark.svg" alt="showup" class="logo-dark">
                <img src="assets/images/logo-light.svg" alt="showup" class="logo-light">
            </a>
            <div class="nav-actions">
                <div class="lang-dropdown" id="langDropdown">
                    <button class="lang-current" id="langCurrent" aria-label="Change language">
                        <span>KO</span>
                        <svg viewBox="0 0 10 6" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M1 1l4 4 4-4"/></svg>
                    </button>
                    <div class="lang-menu">
                        <a href="contact.html">EN</a>
                        <a href="contact-ko.html" class="active">KO</a>
                        <a href="contact-de.html">DE</a>
                    </div>
                </div>
                <button class="theme-toggle" id="themeToggle" aria-label="Toggle theme">
                    <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
                    <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
                </button>
            </div>
        </div>
    </nav>

    <main class="contact-content">
        <h1>문의</h1>
        <p class="contact-subtitle">
            질문, 피드백, 또는 Showup에 대해 더 알고 싶으시면 언제든 연락주세요.
        </p>

        <h2>이메일</h2>
        <p>
            이메일 주소<br>
            <a href="mailto:support@showupcounts.com" class="contact-email">support@showupcounts.com</a>
        </p>

        <h2>팔로우</h2>
        <p>
            <a href="https://instagram.com/showupcounts" target="_blank">@showupcounts on Instagram</a>
        </p>
    </main>

    <!-- Footer -->
    <footer class="footer">
        <div class="footer-inner">
            <div class="footer-top">
                <div class="footer-brand">
                    <a href="index.html" class="footer-logo">
                        <img src="assets/images/logo-dark.svg" alt="showup" class="logo-dark">
                        <img src="assets/images/logo-light.svg" alt="showup" class="logo-light">
                    </a>
                    <p>피트니스 커뮤니티를 만드세요. 연결하고, 훈련하고, 함께 성장하세요.</p>
                </div>
                <div class="footer-links">
                    <div class="footer-col">
                        <h4>법적 고지</h4>
                        <a href="legal/privacy-ko.html">개인정보처리방침</a>
                        <a href="legal/terms-ko.html">이용약관</a>
                    </div>
                    <div class="footer-col">
                        <h4>연결</h4>
                        <a href="https://instagram.com/showupcounts" target="_blank">Instagram</a>
                        <a href="contact-ko.html">문의</a>
                    </div>
                </div>
            </div>
            <div class="footer-bottom">
                <p>&copy; 2025 Showup. All rights reserved.</p>
            </div>
        </div>
    </footer>

    <script>
        const themeToggle = document.getElementById('themeToggle');
        function toggleTheme() {
            const current = document.documentElement.getAttribute('data-theme');
            const next = current === 'light' ? 'dark' : 'light';
            document.documentElement.setAttribute('data-theme', next);
            localStorage.setItem('theme', next);
            document.getElementById('favicon').href = next === 'light' ? 'assets/favicon-light.svg' : 'assets/favicon-dark.svg';
        }
        themeToggle.addEventListener('click', toggleTheme);

        const langDropdown = document.getElementById('langDropdown');
        const langCurrent = document.getElementById('langCurrent');
        langCurrent.addEventListener('click', () => {
            langDropdown.classList.toggle('open');
        });
        document.addEventListener('click', (e) => {
            if (!langDropdown.contains(e.target)) langDropdown.classList.remove('open');
        });

        window.matchMedia('(prefers-color-scheme: light)').addEventListener('change', (e) => {
            localStorage.removeItem('theme');
            const theme = e.matches ? 'light' : 'dark';
            document.documentElement.setAttribute('data-theme', theme);
            document.getElementById('favicon').href = theme === 'light' ? 'assets/favicon-light.svg' : 'assets/favicon-dark.svg';
        });
    </script>
</body>
</html>
